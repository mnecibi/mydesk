server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Filenames are not hashed, so browsers should revalidate after deployment.
    add_header Cache-Control "no-cache";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript model/gltf-binary;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.glb$ {
        types { model/gltf-binary glb; }
        try_files $uri =404;
    }
}
