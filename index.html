<body>
  <header class="toolbar">
    <h1>My desk</h1>
    <div class="actions" aria-label="Scene controls">
      <button id="reset" type="button" disabled>Reset view</button>
    </div>
  </header>
  <main id="viewer" aria-label="My desk in three dimensions">
    <canvas id="scene" tabindex="0"
      aria-label="3D view of My desk. Drag to rotate and scroll to zoom."></canvas>
    <p id="status" role="status">Loading My desk…</p>
    <noscript>Enable JavaScript to explore My desk in 3D.</noscript>
  </main>
  <footer>Drag to rotate <span aria-hidden="true">·</span> Scroll or pinch to zoom</footer>
